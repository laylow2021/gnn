# AML Graph Autoencoder Configuration

graph:
  matching_strategy: "exact_1_to_1" # Options: exact_1_to_1, many_to_one, one_to_many, hybrid
  time_window_days: 3 # Increased to capture temporal lags
  amount_tolerance_pct: 0.01
  max_mule_depth: 4
  min_transaction_amount: 500 # Capture smaller mule movements
  min_edge_flow_ratio: 0.01 # Keep low-volume connections
  min_edge_frequency: 1 # Allow one-time hops (Pass-throughs)
  min_scarcity_threshold: 0.01 # Keep all common amounts
  node_features: []
 # List all columns from input data to aggregate (mean) as node features
  edge_features:
    - "log_total_amount"
    - "edge_frequency"
    - "mean_scarcity"
    - "min_time_delta"
    - "outflow_ratio"
    - "inflow_ratio"

model:
  device: "auto" # Options: auto, cuda, cpu
  hidden_channels: 64
  out_channels: 32
  num_layers: 3
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 1e-5
  node_loss_weight: 0.7
  edge_loss_weight: 0.3

data:
  num_customers: 100
  num_days: 10
  avg_tx_per_day: 5
  anomaly_ratio: 0.01
  column_mapping:
    customer_id: "customer_id"
    transaction_id: "transaction_id"
    amount: "amount"
    amount_scarcity: "your_actual_scarcity_column" # Change this to your column name
    date: "date"
    direction: "direction"
    direction_in: "IN"
    direction_out: "OUT"
