# AML Graph Autoencoder Configuration

graph:
  matching_strategy: "many_to_one" # Options: exact_1_to_1, many_to_one
  time_window_days: 2
  amount_tolerance_pct: 0.01
  max_mule_depth: 4
  min_transaction_amount: 50
  min_edge_flow_ratio: 0.1
  node_features: [] # List all columns from input data to aggregate (mean) as node features
  edge_features:
    - "log_total_amount"
    - "edge_frequency"
    - "mean_scarcity"
    - "min_time_delta"
    - "outflow_ratio"
    - "inflow_ratio"

model:
  device: "auto" # Options: auto, cuda, cpu
  hidden_channels: 64
  out_channels: 32
  num_layers: 3
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 1e-5
  node_loss_weight: 0.7
  edge_loss_weight: 0.3

data:
  num_customers: 100
  num_days: 10
  avg_tx_per_day: 5
  anomaly_ratio: 0.01
  column_mapping:
    customer_id: "customer_id"
    amount: "amount"
    date: "date"
    direction: "direction"
    direction_in: "IN"
    direction_out: "OUT"
