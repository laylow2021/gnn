data:
  anomaly_ratio: 0.01
  avg_tx_per_day: 5
  column_mapping:
    amount: amount
    customer_id: customer_id
    date: date
    direction: direction
    direction_in: IN
    direction_out: OUT
    transaction_id: transaction_id
  num_customers: 100
  num_days: 10
graph:
  amount_tolerance_pct: 0.01
  edge_features:
  - log_total_amount
  - edge_frequency
  - mean_scarcity
  - min_time_delta
  - outflow_ratio
  - inflow_ratio
  matching_strategy: many_to_one
  max_mule_depth: 4
  min_edge_flow_ratio: 0.1
  min_edge_frequency: 2
  min_scarcity_threshold: 0.05
  min_transaction_amount: 50
  node_features:
  - vol_log
  time_window_days: 2
model:
  device: auto
  dropout: 0.1
  edge_loss_weight: 0.3
  hidden_channels: 64
  learning_rate: 0.001
  node_loss_weight: 0.7
  num_layers: 3
  out_channels: 32
  weight_decay: 1e-5
